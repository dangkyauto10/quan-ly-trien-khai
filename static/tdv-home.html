<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TDV">
  <link rel="apple-touch-icon" sizes="144x144" href="/app/static/tdv_icon_144.png?v=20261027c">
  <link rel="icon" type="image/png" sizes="144x144" href="/app/static/tdv_icon_144.png?v=20261027c">
  <link rel="manifest" href="/app/static/manifest.json?v=20261027b">
  <title>DỰ ÁN TDV · Cài biểu tượng</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px;
           color: #f8fafc; background: radial-gradient(circle at top, #26344b, #10131a 62%); }
    main { width: min(100%, 460px); text-align: center; padding: 28px 22px; border-radius: 24px;
           background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); }
    img { width: 112px; height: 112px; border-radius: 24px; object-fit: cover; }
    h1 { font-size: 1.45rem; margin: 18px 0 8px; }
    p { color: #d5deeb; line-height: 1.6; }
    .button { display: block; margin: 22px 0 18px; padding: 14px 18px; border-radius: 14px;
              color: #10131a; background: #f6b21a; font-weight: 800; text-decoration: none; }
    .steps { text-align: left; padding: 14px 16px; border-radius: 14px; background: rgba(0,0,0,.2); }
    .steps p { margin: 8px 0; font-size: .95rem; }
    small { display: block; margin-top: 16px; color: #aebbd0; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <img src="/app/static/tdv_icon_144.png?v=20261027c" alt="Logo TDV">
    <h1>QUẢN LÝ DỰ ÁN</h1>
    <p>Ghim biểu tượng logo TDV lên màn hình điện thoại.</p>
    <a class="button" href="/">MỞ ỨNG DỤNG</a>
    <section class="steps">
      <p><strong>iPhone:</strong> Safari → Chia sẻ ⬆️ → Thêm vào Màn hình chính → Thêm.</p>
      <p><strong>Android:</strong> Chrome → ⋮ → Cài đặt và tạo lối tắt / Thêm vào màn hình chính.</p>
    </section>
    <small>Nếu trên màn hình đang có icon cũ, hãy xóa icon đó rồi ghim lại từ trang này.</small>
  </main>
  <script>
    if (window.navigator.standalone ||
        window.matchMedia("(display-mode: standalone)").matches) {
      window.location.replace("/");
    }
  </script>
</body>
</html>
