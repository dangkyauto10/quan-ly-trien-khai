name: Preview syntax checks
on:
  push:
    branches: [preview-20261022, recovery-preview-20261026]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import parser dependencies
        run: python -m pip install 'openpyxl>=3.1,<4' 'python-docx>=1.1,<2'
      - name: Check syntax
        run: python -m py_compile preview_app.py preview_import_locations.py preview_registration.py preview_approval_ui.py preview_assignment.py preview_remember.py preview_bulk_allocation.py preview_progress_rules.py preview_report_commit.py preview_allocation_groups.py preview_bulk_excel.py preview_leadership.py preview_leader_access.py preview_team_access.py preview_handover.py preview_hub.py preview_user_guide.py preview_credential_accounts.py preview_signup_credentials.py preview_team_detach.py preview_site_rights.py preview_team_reassignment.py generate_preview_hash.py
      - name: Test location imports
        run: python -m unittest discover -s tests -v
