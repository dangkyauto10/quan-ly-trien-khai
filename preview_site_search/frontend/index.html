<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 4px 0 8px; color: #253247;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .label { margin: 0 0 7px; font-size: 16px; font-weight: 650; }
  input {
    width: 100%; min-height: 48px; padding: 11px 14px;
    border: 1px solid #cbd2dc; border-radius: 8px;
    background: #f4f6f9; color: #1f2937; font-size: 16px;
    outline: none;
  }
  input:focus { border: 2px solid #4b73bd; background: #fff; }
  #selected { margin-top: 8px; color: #334155; font-size: 14px;
              font-weight: 650; line-height: 1.4; }
  #results { display: grid; gap: 6px; margin-top: 8px; }
  .option {
    width: 100%; min-height: 48px; padding: 10px 12px;
    border: 1px solid #cbd5e1; border-radius: 8px;
    background: #fff; color: #1e293b; text-align: left;
    font: inherit; font-size: 15px; line-height: 1.35;
    touch-action: manipulation;
  }
  .option:active { background: #eaf1fb; border-color: #4b73bd; }
  .hint { margin-top: 6px; color: #64748b; font-size: 13px; }
</style>
</head>
<body>
  <div class="label">🔎 Tìm điểm được giao</div>
  <input id="query" type="text" autocomplete="off" autocapitalize="off"
    placeholder="Gõ tên địa điểm hoặc mã điểm" aria-label="Tìm điểm được giao">
  <div id="selected" aria-live="polite"></div>
  <div id="results" role="listbox" aria-label="Kết quả tìm địa điểm"></div>
  <div id="hint" class="hint">Gõ tên hoặc mã điểm; chạm kết quả để mở báo cáo.</div>
<script>
  let args = {};
  let query = "";
  let lastSelectedId = null;
  const input = document.getElementById("query");
  const selected = document.getElementById("selected");
  const results = document.getElementById("results");
  const hint = document.getElementById("hint");

  function send(type, value) {
    const message = {isStreamlitMessage: true, type};
    if (type === "streamlit:componentReady") {
      message.apiVersion = value && value.apiVersion;
    } else {
      message.value = value;
    }
    window.parent.postMessage(message, "*");
  }

  function setHeight() {
    const height = Math.ceil(document.documentElement.scrollHeight + 8);
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height
    }, "*");
  }

  function normalize(value) {
    return String(value || "").toLocaleLowerCase("vi")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/đ/g, "d").trim();
  }

  function renderResults() {
    results.replaceChildren();
    const needle = normalize(query);
    if (!needle) {
      hint.textContent = "Gõ tên hoặc mã điểm; chạm kết quả để mở báo cáo.";
      setHeight();
      return;
    }
    const options = Array.isArray(args.options) ? args.options : [];
    const matches = options.filter(option =>
      normalize(option.label).includes(needle)
    );
    if (!matches.length) {
      hint.textContent = "Không tìm thấy điểm khớp. Hãy sửa từ khóa.";
      setHeight();
      return;
    }
    const shown = matches.slice(0, 10);
    hint.textContent = matches.length > shown.length
      ? "Có " + matches.length + " kết quả; gõ thêm để thu hẹp."
      : "Chạm vào một dòng để mở báo cáo của điểm đó.";
    shown.forEach(option => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "option";
      button.setAttribute("role", "option");
      button.textContent = "📍 " + String(option.label || "");
      button.addEventListener("click", () => {
        send("streamlit:setComponentValue", {
          selectedId: String(option.id || ""),
          query: "",
          eventId: String(Date.now()) + "-" + Math.random().toString(36).slice(2)
        });
      });
      results.appendChild(button);
    });
    setHeight();
  }

  function onRender(data) {
    args = data.args || {};
    const nextSelectedId = String(args.selectedId || "");
    if (lastSelectedId !== null && nextSelectedId !== lastSelectedId) {
      input.blur();
      query = "";
      input.value = "";
      renderResults();
    }
    lastSelectedId = nextSelectedId;
    const nextQuery = String(args.query || "");
    if (nextQuery !== query && document.activeElement !== input) {
      query = nextQuery;
      input.value = nextQuery;
      renderResults();
    }
    selected.textContent = args.selectedLabel
      ? "Đang chọn: " + args.selectedLabel : "";
    setHeight();
  }

  window.addEventListener("message", event => {
    const data = event.data || {};
    if (data.type === "streamlit:render") onRender(data);
  });

  input.addEventListener("input", () => {
    query = input.value;
    renderResults();
  });

  window.addEventListener("load", () => {
    send("streamlit:componentReady", {apiVersion: 1});
    setHeight();
  });
</script>
</body>
</html>
