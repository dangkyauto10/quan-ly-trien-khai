# BẢN MẪU KHÔNG CHỨA KHÓA THẬT — đưa giá trị vào Streamlit Cloud Secrets
spreadsheet_id = "NEW_PREVIEW_SPREADSHEET_ID"
photos_folder_id = "GOOGLE_DRIVE_PREVIEW_FOLDER_ID"

[gcp_service_account]
type = "service_account"
project_id = "REPLACE_ME"
private_key_id = "REPLACE_ME"
private_key = "-----BEGIN PRIVATE KEY-----\nREPLACE_ME\n-----END PRIVATE KEY-----\n"
client_email = "new-preview-account@your-project.iam.gserviceaccount.com"
client_id = "REPLACE_ME"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"

# Không dùng PIN đơn giản; tạo SALT_HEX và PBKDF2_HASH_HEX qua script generate_preview_hash.py
[accounts.admin_preview]
role = "ADMIN"
team_id = ""
salt = "RANDOM_SALT_HEX"
hash = "PBKDF2_HASH_HEX"

[accounts.leader_preview]
role = "LANH_DAO"
team_id = ""
salt = "RANDOM_SALT_HEX"
hash = "PBKDF2_HASH_HEX"

[accounts.vc_preview]
role = "DOI_TRUONG"
team_id = "VC-01"
salt = "RANDOM_SALT_HEX"
hash = "PBKDF2_HASH_HEX"

[accounts.ktv_preview]
role = "DOI_TRUONG"
team_id = "KTV-01"
salt = "RANDOM_SALT_HEX"
hash = "PBKDF2_HASH_HEX"

[accounts.member_preview]
role = "THANH_VIEN"
team_id = ""
salt = "RANDOM_SALT_HEX"
hash = "PBKDF2_HASH_HEX"

# OAuth yêu cầu đúng một thư mục qua Google Picker (drive.file).
# Không cấp quyền toàn bộ Drive; không đưa giá trị thật vào GitHub.
[google_drive_oauth]
client_id = "GOOGLE_OAUTH_WEB_CLIENT_ID"
client_secret = "GOOGLE_OAUTH_WEB_CLIENT_SECRET"
refresh_token = "GOOGLE_DRIVE_REFRESH_TOKEN_WITH_drive.file_SCOPE"
picker_api_key = "GOOGLE_PICKER_API_KEY"
