<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2px 0; font-family: sans-serif; color: #1f2937; }
    .toolbar { display: flex; gap: 8px; align-items: center; }
    button {
      min-height: 44px; padding: 10px 16px; border: 0; border-radius: 9px;
      background: #155eef; color: #fff; font-size: 16px; font-weight: 700;
      cursor: pointer; width: 100%;
    }
    button:disabled { background: #aab7cf; cursor: not-allowed; }
    #count { margin: 8px 0; color: #475569; font-size: 14px; }
    #status { margin: 6px 0; color: #b42318; font-size: 14px; }
    #gallery {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px; margin-top: 8px;
    }
    .tile { position: relative; width: 100%; aspect-ratio: 1 / 1; }
    .tile img { width: 100%; height: 100%; object-fit: cover; border-radius: 7px; }
    .remove {
      position: absolute; top: 2px; right: 2px; width: 25px; min-height: 25px;
      height: 25px; padding: 0; border-radius: 50%; background: #b42318;
      font-size: 18px; line-height: 25px;
    }
    @media (max-width: 420px) {
      #gallery { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
    }
  </style>
</head>
<body>
  <input id="camera" type="file" accept="image/*" capture="environment"
         style="display:none">
  <button id="capture" type="button">📸 CHỤP ẢNH BẰNG CAMERA SAU</button>
  <div id="count">Đã chụp 0/10 ảnh</div>
  <div id="status" role="status"></div>
  <div id="gallery" aria-label="Ảnh đã chụp"></div>

  <script>
    let args = {maxPhotos: 10, initialPhotos: []};
    let photos = [];
    let lastSeed = null;
    const input = document.getElementById("camera");
    const button = document.getElementById("capture");
    const count = document.getElementById("count");
    const status = document.getElementById("status");
    const gallery = document.getElementById("gallery");

    function send(type, value) {
      const message = {isStreamlitMessage: true, type};
      if (type === "streamlit:componentReady") {
        message.apiVersion = value?.apiVersion;
      } else {
        message.value = value;
      }
      window.parent.postMessage(message, "*");
    }

    function setHeight() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: document.documentElement.scrollHeight
      }, "*");
    }

    function emit() {
      send("streamlit:setComponentValue", {photos});
    }

    function render() {
      const limit = Math.max(0, Math.min(10, Number(args.maxPhotos ?? 10)));
      count.textContent = "Đã chụp " + photos.length + "/" + limit + " ảnh";
      button.disabled = photos.length >= limit;
      button.textContent = limit === 0
        ? "Đã đủ 10 ảnh"
        : (photos.length ? "📸 CHỤP THÊM ẢNH (CAMERA SAU)" :
                           "📸 CHỤP ẢNH BẰNG CAMERA SAU");
      gallery.replaceChildren();
      photos.forEach((photo, index) => {
        const tile = document.createElement("div");
        tile.className = "tile";
        const image = document.createElement("img");
        image.src = photo.data;
        image.alt = "Ảnh hiện trường " + (index + 1);
        const remove = document.createElement("button");
        remove.className = "remove";
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "Xóa ảnh " + (index + 1));
        remove.addEventListener("click", () => {
          photos.splice(index, 1);
          status.textContent = "";
          render();
          emit();
        });
        tile.append(image, remove);
        gallery.appendChild(tile);
      });
      setHeight();
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          const scale = Math.min(1, 1600 / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(objectUrl);
          canvas.toBlob(blob => {
            if (!blob) return reject(new Error("Không xử lý được ảnh."));
            const reader = new FileReader();
            reader.onload = () => resolve({
              name: "anh_hien_truong_" + Date.now() + ".jpg",
              data: reader.result
            });
            reader.onerror = () => reject(new Error("Không đọc được ảnh."));
            reader.readAsDataURL(blob);
          }, "image/jpeg", 0.82);
        };
        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("Định dạng ảnh này chưa đọc được."));
        };
        image.src = objectUrl;
      });
    }

    button.addEventListener("click", () => {
      status.textContent = "";
      input.click();
    });

    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      input.value = "";
      if (!file) return;
      const limit = Math.max(0, Math.min(10, Number(args.maxPhotos ?? 10)));
      if (photos.length >= limit) {
        status.textContent = "Đã đủ số ảnh cho phép.";
        return;
      }
      try {
        const photo = await compressImage(file);
        photos.push(photo);
        render();
        emit();
      } catch (error) {
        status.textContent = error.message || "Không xử lý được ảnh.";
        setHeight();
      }
    });

    window.addEventListener("message", event => {
      const data = event.data || {};
      if (data.type !== "streamlit:render") return;
      args = data.args || args;
      const seed = JSON.stringify(Array.isArray(args.initialPhotos) ? args.initialPhotos : []);
      if (seed !== lastSeed) {
        lastSeed = seed;
        photos = Array.isArray(args.initialPhotos) ? args.initialPhotos.slice(0, 10) : [];
      }
      render();
    });

    window.addEventListener("load", () => {
      send("streamlit:componentReady", {apiVersion: 1});
      setHeight();
      render();
    });
    window.addEventListener("resize", setHeight);
  </script>
</body>
</html>
